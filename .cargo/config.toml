# This machine has 12 GB RAM; the bundled DuckDB build spawns huge C++
# translation units that freeze the box at 16-way parallelism.
# These settings make plain `cargo build` safe everywhere the repo goes;
# remove or raise on a machine with more memory.
[build]
jobs = 2

[env]
NUM_JOBS = "2"
CMAKE_BUILD_PARALLEL_LEVEL = "2"

# Windows cross-build via llvm-mingw (installed to ~/.local/llvm-mingw-*).
# The `gnullvm` target is the supported pairing with llvm-mingw (the plain
# gnu target wants GNU libstdc++/libgcc, which llvm-mingw does not ship).
[target.x86_64-pc-windows-gnullvm]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
# NOTE: no rustflags here. Forcing static libc++ duplicates symbols with the
# copy embedded in the bundled DuckDB static build. The exe depends on
# llvm-mingw's libc++.dll + libunwind.dll, which ship alongside it in dist/
# (see AGENTS.md).
